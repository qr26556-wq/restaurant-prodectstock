<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Generator — RestaurantStock</title>
  <style>body{font-family:system-ui;padding:18px;background:#f6f7fb}label{display:block;margin:8px 0}input,select{padding:8px;width:100%;max-width:360px}button{padding:8px 12px;margin-top:8px} .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px} .qr-card{text-align:center;padding:10px;background:#fff;border-radius:8px;border:1px solid #e5e7eb}</style>
</head>
<body>
  <h1>Table QR Generator</h1>
  <p>Generate QR links for tables. Use the SHOP code that your customers will use (e.g. owner_ABC123 or local_shop_default)</p>
  <label>Shop code <input id="shop" value="local_shop_default"></label>
  <label>Start table number <input id="start" type="number" value="101"></label>
  <label>Count <input id="count" type="number" value="8"></label>
  <button id="gen">Generate QR links</button>
  <div id="out" class="qr-grid"></div>
  <script>
    document.getElementById('gen').addEventListener('click', ()=>{
      const shop = encodeURIComponent(document.getElementById('shop').value.trim());
      const start = Number(document.getElementById('start').value)||101;
      const count = Number(document.getElementById('count').value)||8;
      const out = document.getElementById('out'); out.innerHTML='';
      for(let i=0;i<count;i++){
        const t = start + i;
        const url = location.origin + '/public/order.html?shop=' + shop + '&table=' + t;
        const q = 'https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=' + encodeURIComponent(url);
        const div = document.createElement('div'); div.className='qr-card'; div.innerHTML = `<img src="${q}" alt="QR for ${t}"><div style="margin-top:8px;font-weight:600">Table ${t}</div><a href="${url}" target="_blank">Open</a>`;
        out.appendChild(div);
      }
    });
  </script>
</body>
</html>
