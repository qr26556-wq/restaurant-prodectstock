<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#1B1B18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<title>Settings — RESTPOS</title>
</head>
<body>
  <div class="app-shell">
    <div id="navHost"></div>
    <div class="main">
      <div class="topbar">
        <h1>Settings</h1>
        <div class="who" id="whoLabel"></div>
      </div>
      <div class="page">

        <div class="card" style="padding:18px; max-width:640px">
          <div class="section-title"><h2>Restaurant details</h2></div>
          <p class="hint" style="margin:0 0 16px">Shown on receipts, the dashboard and the sidebar.</p>
          <form id="settingsForm">
            <div class="field"><label>Restaurant name</label><input id="sName" required></div>
            <div class="field"><label>Address</label><input id="sAddress" placeholder="Street, city"></div>
            <div class="field-row">
              <div class="field"><label>Phone</label><input id="sPhone" type="tel"></div>
              <div class="field"><label>Currency symbol</label><input id="sCurrency" maxlength="4" placeholder="₹"></div>
            </div>
            <div class="field"><label>Tax percentage</label><input id="sTax" type="number" min="0" max="100" step="0.01"></div>
            <div class="field"><label>Receipt footer message</label><textarea id="sFooter" rows="2" placeholder="Thank you for dining with us!"></textarea></div>
            <div class="field">
              <label>Receipt paper width</label>
              <select id="sPaperWidth">
                <option value="80">80mm (standard)</option>
                <option value="58">58mm (compact)</option>
              </select>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- floating save bar -->
  <div class="card" id="saveBar" style="position:sticky; bottom:16px; margin:16px auto 0; max-width:640px; padding:12px 16px; display:flex; justify-content:flex-end; gap:8px">
    <span class="hint" id="saveHint" style="margin-right:auto; align-self:center"></span>
    <button class="btn btn-primary" id="saveSettingsBtn">Save changes</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/db.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
