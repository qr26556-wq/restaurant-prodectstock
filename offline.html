<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — Restaurant In&Out</title>
  <style>
    :root{background:#f6f1e4;color:#241d14;font-family:system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
    .card{background:#fff;padding:24px;border-radius:12px;max-width:520px;text-align:center;border:1px solid #e6dcc6}
    .btn{display:inline-block;margin-top:16px;padding:10px 14px;border-radius:8px;background:#b9690f;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>You're offline</h1>
    <p>The app is not connected to the internet right now. Some features may be unavailable, but you can still view cached pages.</p>
    <p>If you were trying to load the app, try reloading the page once you're back online.</p>
    <a href="./" class="btn">Return to app</a>
  </main>
</body>
</html>
