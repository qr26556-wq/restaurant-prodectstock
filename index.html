<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <title>Restaurant POS - PWA Starter</title>
</head>
<body>
  <header>
    <h1>Restaurant POS</h1>
    <button id="installBtn" class="hidden">Install App</button>
  </header>

  <main>
    <section class="controls">
      <button id="seed">Load sample products</button>
      <button id="clear">Clear cart</button>
    </section>

    <div class="wrap">
      <div class="products card">
        <h2>Products</h2>
        <div id="productList"></div>
      </div>
      <div class="cart card">
        <h2>Cart</h2>
        <div id="cartList"></div>
        <div class="total">Total: ₹<span id="total">0.00</span></div>
        <div class="actions"><button id="pay">Pay (Cash)</button></div>
      </div>
    </div>

    <section class="orders card">
      <h2>Orders</h2>
      <div id="ordersList"><i>No orders yet.</i></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
