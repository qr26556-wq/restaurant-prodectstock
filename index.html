<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#7A0F1F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<title>RESTPOS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#2A0E12 0%,#1B0A0C 100%);font-family:system-ui,sans-serif;color:#FBF3E3}
  .mark{width:52px;height:52px;border-radius:8px;background:#A6182C;border:2px solid #C9971F;display:flex;align-items:center;justify-content:center;font-family:'Ma Shan Zheng',cursive;font-weight:400;font-size:24px;color:#F7EAC5;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>
<body>
  <div class="mark">R</div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        const snap = await db.collection('users').doc(user.uid).get();
        if (snap.exists && snap.data().active !== false) {
          const role = snap.data().role;
          window.location.href = (role === 'admin' || role === 'manager') ? 'dashboard.html' : 'pos.html';
        } else {
          window.location.href = 'login.html';
        }
      } catch (e) {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
