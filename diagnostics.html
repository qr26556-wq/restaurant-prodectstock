<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#7A0F1F">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<title>Diagnostics — RESTPOS</title>
<style>
  body{padding:20px; max-width:640px; margin:0 auto}
  .diag-row{display:flex; gap:10px; align-items:flex-start; padding:12px 0; border-bottom:1px solid rgba(0,0,0,.08)}
  .diag-dot{width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none}
  .diag-dot.pass{background:#2e7d32}
  .diag-dot.fail{background:#c62828}
  .diag-dot.warn{background:#e8590c}
  .diag-dot.pending{background:#999}
  .diag-title{font-weight:700; font-size:14px}
  .diag-detail{font-size:12.5px; color:#666; margin-top:2px; white-space:pre-wrap; word-break:break-word}
  #jsErrors{margin-top:18px}
  .err-item{background:#fdeaea; border:1px solid #f3c2c2; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; white-space:pre-wrap; word-break:break-word}
</style>
</head>
<body>
  <h1 style="margin-bottom:4px">RESTPOS Diagnostics</h1>
  <p class="hint" style="margin-top:0 0 16px">
    Runs a set of checks and lists exactly what's wrong — no need to send screenshots.
    Tap "Copy report" at the bottom and paste it back into the chat.
  </p>

  <div id="checks"></div>

  <h2 style="margin-top:24px; font-size:15px">JavaScript errors caught on this page</h2>
  <div id="jsErrors"><p class="hint">None yet.</p></div>

  <div style="display:flex; gap:8px; margin-top:20px">
    <button class="btn btn-primary" id="copyBtn">Copy report</button>
    <a class="btn" href="login.html">Back to sign in</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    // Catch every JS error / unhandled promise rejection on this page and
    // show it plainly — this is often what a "Could not sign in" or
    // "Missing or insufficient permissions" toast is hiding.
    const jsErrors = [];
    function logJsError(msg) {
      jsErrors.push({ time: new Date().toLocaleTimeString(), msg });
      renderJsErrors();
    }
    window.addEventListener('error', (e) => logJsError(e.message + (e.filename ? ` (${e.filename}:${e.lineno})` : '')));
    window.addEventListener('unhandledrejection', (e) => logJsError('Unhandled promise rejection: ' + (e.reason?.message || e.reason)));
    function renderJsErrors() {
      const host = document.getElementById('jsErrors');
      if (!jsErrors.length) { host.innerHTML = '<p class="hint">None yet.</p>'; return; }
      host.innerHTML = jsErrors.map(e => `<div class="err-item">[${e.time}] ${escapeHtml(e.msg)}</div>`).join('');
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
  <script src="js/firebase-config.js"></script>
  <script src="js/diagnostics.js"></script>
</body>
</html>
