<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#1B1B18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<title>Products — RESTPOS</title>
</head>
<body>
  <div class="app-shell">
    <div id="navHost"></div>
    <div class="main">
      <div class="topbar">
        <h1>Products</h1>
        <div class="who" id="whoLabel"></div>
      </div>
      <div class="page">

        <div class="toolbar">
          <div class="filters">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="searchInput" placeholder="Search name or SKU…">
            </div>
            <select id="categoryFilter" style="width:auto"><option value="all">All categories</option></select>
            <select id="stockFilter" style="width:auto">
              <option value="all">All stock levels</option>
              <option value="low">Low stock</option>
              <option value="out">Out of stock</option>
            </select>
          </div>
          <div style="display:flex; gap:8px">
            <button class="btn" id="manageCatsBtn">Categories</button>
            <button class="btn btn-primary" id="addProductBtn">Add product</button>
          </div>
        </div>

        <div class="card table-scroll">
          <table class="data" id="productsTable">
            <thead><tr><th></th><th>Product</th><th>Category</th><th>SKU</th><th>Price</th><th>Cost</th><th>Stock</th><th>Available</th><th></th></tr></thead>
            <tbody><tr><td colspan="9" class="hint" style="padding:16px 10px">Loading…</td></tr></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <!-- Product form modal -->
  <div class="modal-backdrop" id="productModal">
    <div class="modal">
      <div class="modal-head"><h2 id="productModalTitle">Add product</h2><button class="icon-btn" onclick="RESTPOS.closeModal('productModal')">✕</button></div>
      <div class="modal-body">
        <form id="productForm">
          <input type="hidden" id="pId">
          <div class="field"><label>Product name</label><input id="pName" required></div>
          <div class="field-row">
            <div class="field"><label>Category</label><select id="pCategory" required></select></div>
            <div class="field"><label>SKU</label><input id="pSku"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Selling price</label><input id="pPrice" type="number" min="0" step="0.01" required></div>
            <div class="field"><label>Cost price</label><input id="pCost" type="number" min="0" step="0.01"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Stock quantity</label><input id="pStock" type="number" min="0" step="1" required></div>
            <div class="field"><label>Low-stock alert below</label><input id="pLowStock" type="number" min="0" step="1" value="5"></div>
          </div>
          <div class="field"><label>Image URL (optional)</label><input id="pImage" placeholder="https://…"></div>
          <div class="field"><label>Description</label><textarea id="pDesc" rows="2"></textarea></div>
          <div class="field" style="display:flex; align-items:center; gap:8px">
            <input type="checkbox" id="pAvailable" style="width:auto" checked>
            <label style="margin:0">Available for sale</label>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" id="deleteProductBtn" style="display:none; margin-right:auto">Delete</button>
        <button class="btn" onclick="RESTPOS.closeModal('productModal')">Cancel</button>
        <button class="btn btn-primary" id="saveProductBtn">Save product</button>
      </div>
    </div>
  </div>

  <!-- Categories modal -->
  <div class="modal-backdrop" id="catModal">
    <div class="modal">
      <div class="modal-head"><h2>Categories</h2><button class="icon-btn" onclick="RESTPOS.closeModal('catModal')">✕</button></div>
      <div class="modal-body">
        <form id="catForm" style="display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap">
          <label for="catImageInput" id="catImagePreview" style="width:48px; height:48px; border:1px dashed var(--line,#ccc); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; overflow:hidden; flex:none">🍕</label>
          <input type="file" id="catImageInput" accept="image/*" class="hidden">
          <input id="catName" placeholder="Category name" required style="flex:1; min-width:140px">
          <button class="btn btn-primary" type="submit" id="addCatBtn">Add</button>
        </form>
        <p class="hint" style="margin:-8px 0 14px">Tap the square to upload a picture for this category (optional — defaults to a plate emoji).</p>
        <div id="catList"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
