<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Customer Order — RestaurantStock</title>
  <meta name="description" content="Place an order from your phone" />
  <link rel="stylesheet" href="/public/order.css">
</head>
<body>
  <main class="order-app">
    <header class="order-header">
      <h1 id="shopName">Restaurant</h1>
      <div id="orderMeta" class="meta"></div>
    </header>

    <section class="menu">
      <div class="search-row"><input id="search" placeholder="Search menu…" aria-label="Search menu"></div>
      <div id="menuGrid" class="menu-grid"></div>
    </section>

    <aside class="cart" id="cartArea">
      <h2>Your Order</h2>
      <div id="cartList" class="cart-list"></div>
      <div class="cart-summary">
        <div>Total: <span id="cartTotal">$0.00</span></div>
        <label> Name <input id="custName"></label>
        <label> Phone <input id="custPhone" inputmode="tel"></label>
        <label id="addrLabel"> Address <input id="custAddr"></label>
        <div class="actions">
          <button id="placeOrder" class="btn primary">Place Order (Cash)</button>
        </div>
        <div id="orderStatus" class="status"></div>
      </div>
    </aside>
  </main>

  <script src="/public/order.js" type="module"></script>
</body>
</html>
