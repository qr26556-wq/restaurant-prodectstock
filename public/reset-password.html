<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Naya password set karein — ReelForge</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <a href="index.html" class="brand">ReelForge<span class="dot">.</span></a>
  <div class="nav-links">
    <div data-auth-slot style="display:flex; gap:10px;"></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Naya password set karein</h1>
    <p class="sub">Neeche apna naya password daalein.</p>

    <div class="form-msg" id="msg"></div>

    <form id="resetForm">
      <div class="field">
        <label for="password">Naya password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmPassword">Password confirm karein</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Password reset karein</button>
    </form>

    <p class="switch-line"><a href="login.html">Login par wapas jayein</a></p>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const email = params.get('email');

  const msg = document.getElementById('msg');
  const form = document.getElementById('resetForm');

  if (!token || !email) {
    showMsg(msg, 'Ye reset link invalid hai. Dobara forgot-password se try karein.', 'error');
    form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'form-msg';
    const btn = document.getElementById('submitBtn');

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      showMsg(msg, 'Dono password match nahi kar rahe.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Reset ho raha hai…';

    try {
      const data = await API.request('/auth/reset-password', {
        method: 'POST',
        body: { email, token, newPassword: password },
      });
      showMsg(msg, data.message + ' Login page par ja rahe hain…', 'ok');
      setTimeout(() => (window.location.href = 'login.html'), 1500);
    } catch (err) {
      showMsg(msg, err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Password reset karein';
    }
  });
</script>
</body>
</html>
