<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password bhool gaye — ReelForge</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <a href="index.html" class="brand">ReelForge<span class="dot">.</span></a>
  <div class="nav-links">
    <div data-auth-slot style="display:flex; gap:10px;"></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Password bhool gaye?</h1>
    <p class="sub">Apna email daalein, hum aapko reset link bhej denge.</p>

    <div class="form-msg" id="msg"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset link bhejein</button>
    </form>

    <p class="switch-line"><a href="login.html">Login par wapas jayein</a></p>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    msg.className = 'form-msg';

    const email = document.getElementById('email').value.trim();

    btn.disabled = true;
    btn.textContent = 'Bheja ja raha hai…';

    try {
      const data = await API.request('/auth/forgot-password', { method: 'POST', body: { email } });
      showMsg(msg, data.message, 'ok');
      document.getElementById('forgotForm').reset();
      btn.textContent = 'Reset link bhejein';
    } catch (err) {
      showMsg(msg, err.message, 'error');
      btn.textContent = 'Reset link bhejein';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
