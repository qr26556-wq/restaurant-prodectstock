<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signup — ReelForge</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <a href="index.html" class="brand">ReelForge<span class="dot">.</span></a>
  <div class="nav-links">
    <div data-auth-slot style="display:flex; gap:10px;"></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Account banayein</h1>
    <p class="sub">3 free credits ke saath abhi shuru karein.</p>

    <div class="form-msg" id="msg"></div>

    <form id="signupForm">
      <div class="field">
        <label for="name">Naam</label>
        <input type="text" id="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Free account banayein</button>
    </form>

    <p class="switch-line">Pehle se account hai? <a href="login.html">Login karein</a></p>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    msg.className = 'form-msg';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Banaya ja raha hai…';

    try {
      const data = await API.request('/auth/signup', { method: 'POST', body: { name, email, password } });
      API.setToken(data.token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showMsg(msg, err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Free account banayein';
    }
  });
</script>
</body>
</html>
